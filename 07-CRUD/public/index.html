<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de CRUD </title>
    <link rel="stylesheet" href="../../01-primera practica/css/style.css">
</head>
<body>
    
    <header><H1>
        Ejemplo de gestion de usuarios
    </H1></header>
    <main>
        <section class="formulario-section">
            <h2 id="for-titulo" >Agregar nuevo usuario</h2>
            <form id="form-usuario">
                <input type="hidden" id="id-usuario">
                <div class="campo">
                    <label for="nombre"> Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Aqui vva tu nombre" maxlength="60" required>
                    <span id="error-nombre" class="error"></span>
                
                </div>                
                <div class="campo">
                    <label for="nombre"> Fecha de Nacimiento</label>
                    <input type="date" id="fecha_nacimiento"  required>
                    <span id="error-fecha" class="error"></span>
                
                </div> 
                <div class="campo">
                    <label for="nombre"> Nota (0-10)</label>
                    <input type="number" id="nota" placeholder="por ejemplo 8.5" min="0" max="10" required>
                    <span id="error-nota" class="error"></span>
                
                </div> 

                <button type="submit" id="boton-guardar"> Guardar</button>
                <button type="button" id="boton-cancelar" class="btn-secundario" style="display: none;"> Cancelar</button>
            </form>
        </section>

        <section class="table-section">
            <h2>Lista de usuarios</h2>
            <p id=",emsaje-carga"> Cargando Usuarios...</p>
            <p id="mensaje-vacio" style="display: none;">No hya usuarios registrados</p>
            <table id="tabla-usuarios" style="display: none;">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nombre</th>
                        <th>Fecha de nacimiento</th>
                        <th>Nota</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody-usuarios">
                    
                </tbody>
            </table>

        </section>

        <a href="../../index.html" class="btn">Regresar al portafolio</a>

    </main>
    <hr>
</body>
</html>
